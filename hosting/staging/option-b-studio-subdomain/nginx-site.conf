# Zoth public hub — Layout B: studio.nullai.tech static subdomain
# Optimized for Hostinger shared/cloud hosting. Do not proxy 8484 or 8787 here.

server {
    listen 80;
    listen [::]:80;
    server_name studio.nullai.tech;

    root /home/USERNAME/domains/studio.nullai.tech/public_html/studio;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 256;

    # Text/XML answer-engine files — short cache
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /ai.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /humans.txt {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /agents.md {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Static assets — long cache
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback for hub pages (index.html at root)
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # SPA fallback for /studio/ brochure pages
    location ^~ /studio/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /studio/index.html;
    }

    # Pets hangar
    location ^~ /pets/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /pets/index.html;
    }

    # Vault UI shell only (no daemon on this host)
    location ^~ /vault/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /vault/index.html;
    }

    # Default SPA fallback for any other public path
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Block hidden files and secrets
    location ~ /\. {
        deny all;
        return 404;
    }
}
