# Zoth Studio — Hostinger static subpath (Layout C)
# Deploys public/ as /studio/ under nullai.tech
# Hostinger Cloud / VPS KVM. For shared hosting, mirror to public_html/studio/ via File Manager.

server {
    listen 80;
    listen [::]:80;
    server_name nullai.tech www.nullai.tech zoth.nealfrazier.tech localhost;

    # Hostinger document root for the apex; we alias /studio/ to the uploaded subtree.
    root /var/www/nullai/html;
    index index.html;

    server_tokens off;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- Subpath: /studio/ ---
    location ^~ /studio/ {
        # Strip /studio prefix to reach the uploaded subtree
        alias /var/www/nullai/html/studio/;

        # Clean URLs for SPA-like navigation inside the studio pages
        try_files $uri $uri/ /studio/index.html;

        # Cache static assets aggressively
        location ~* ^/studio/assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            try_files $uri =404;
        }

        location ~* ^/studio/pets/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /studio/pets/index.html;
        }

        location ~* ^/studio/vault/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /studio/vault/index.html;
        }

        # Text / AI files for answer engines
        location = /studio/llms.txt {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /studio/ai.txt {
            default_type text/plain;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /studio/robots.txt {
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /studio/sitemap.xml {
            default_type application/xml;
            add_header Cache-Control "public, max-age=3600" always;
        }

        # CSS / JS medium cache
        location ~* ^/studio/.*\.(css|js)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, must-revalidate" always;
            try_files $uri =404;
        }

        # Images / media
        location ~* ^/studio/.*\.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        # Hide dotfiles
        location ~* ^/studio/\. {
            deny all;
            return 404;
        }
    }

    # --- Redirect old domain to /studio/ ---
    location = / {
        if ($host = zoth.nealfrazier.tech) {
            return 301 https://nullai.tech/studio/;
        }
        # Apex behavior can be customized (landing page, existing nullai.tech content, etc.)
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Default fallback (catch-all for non-/studio)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Block private paths that should never be public
    location ^~ /api { return 404; }
    location ^~ /dashboard { return 404; }
    location ^~ /ws { return 404; }

    # Hide dotfiles everywhere
    location ~* /\. {
        deny all;
        return 404;
    }
}
