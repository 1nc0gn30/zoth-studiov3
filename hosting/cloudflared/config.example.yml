# Optional: file-based tunnel config (advanced).
# Prefer the token-based Docker connector from Cloudflare Zero Trust UI.
#
# If you use a credentials file instead of a token:
#   1. Place credentials JSON in this directory (gitignored)
#   2. Map it in docker-compose and run:
#        cloudflared tunnel --config /etc/cloudflared/config.yml run
#
# Public hostname service URL must be the compose service name:
#   http://web:80

tunnel: YOUR_TUNNEL_ID
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: zoth.nealfrazier.tech
    service: http://web:80
  - service: http_status:404
