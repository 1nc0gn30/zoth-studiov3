# Zoth public hub — static only (safe to put behind Cloudflare)
server {
    listen 80;
    server_name zoth.nealfrazier.tech localhost;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787 http://127.0.0.1:8484 http://localhost:8484 https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 256;

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /ai.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /humans.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /agents.md {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Never proxy the operator deck or vault API through the public hub.
    location ^~ /api { return 404; }
    location ^~ /dashboard { return 404; }
    location ^~ /ws { return 404; }

    location ^~ /pets/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /pets/index.html;
    }

    location ^~ /registry/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /registry/index.html;
    }

    # Vault CSS/JS — short cache (avoid week-long immutable stuck deploys)
    location ~* ^/vault/.*\.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787 http://127.0.0.1:8484 http://localhost:8484 https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Note: no ^~ here so the CSS/JS regex above can win for assets
    location /vault/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8787 http://localhost:8787 http://127.0.0.1:8484 http://localhost:8484 https://cdn.jsdelivr.net; worker-src 'self' blob:; media-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /vault/index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
