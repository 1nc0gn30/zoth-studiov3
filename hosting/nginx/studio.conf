# OPTIONAL — local-only reverse proxy to host orchestrator on :8484
# Bound to 127.0.0.1:8089 via compose. Do NOT put this behind the public tunnel
# unless you add Cloudflare Access / basic auth first.

server {
    listen 80;
    server_name localhost;

    server_tokens off;

    location / {
        proxy_pass http://host.docker.internal:8484;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
