# OPTIONAL / ADVANCED — example only. NOT mounted by docker-compose by default.
#
# Preferred setup (recommended):
#   Browser → http://127.0.0.1:8088/vault/  (static UI via zoth-web)
#   Browser → http://127.0.0.1:8787/        (daemon on host loopback, direct)
#
# Only consider a reverse proxy if you need same-origin /vault-api/ for a
# specialized local setup. Do NOT:
#   - put this on the public Cloudflare Tunnel hostname
#   - bind vault-daemon to 0.0.0.0
#   - enable --i-understand-network-risk on the daemon
#
# Docker note: nginx inside the compose bridge network cannot reach the
# host's 127.0.0.1. From the container use host.docker.internal (requires
# extra_hosts: host.docker.internal:host-gateway on the service). Host
# loopback of the *container* is not the host loopback.
#
# If nginx runs on the host (not in Docker), proxy_pass to 127.0.0.1:8787.
#
# Example location block (paste into a private / local-only server{}):

# location /vault-api/ {
#     # Strip prefix so /vault-api/health → http://host:8787/health
#     proxy_pass http://host.docker.internal:8787/;
#     # Or when nginx is on the host OS:
#     # proxy_pass http://127.0.0.1:8787/;
#
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $remote_addr;
#     proxy_set_header X-Forwarded-Proto $scheme;
#
#     # Do not cache vault responses
#     add_header Cache-Control "no-store" always;
#     proxy_buffering off;
# }
#
# Security: never add this location to nginx/default.conf (public hub).
# Tunnel must remain static-only. See HOSTING.md § Local vault stack.
