name: 🐛 Bug Report
description: Report a bug, crash, loopback conflict, daemon error, or UI defect in Zoth Studio.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛡️ Sovereign Bug Report
        Thank you for reporting an issue! Please ensure that your report contains no private identifying information (PII) or unencrypted credentials.

  - type: dropdown
    id: subsystem
    attributes:
      label: 🎛️ Affected Subsystem / Daemon
      description: Select the Zoth Studio component where the defect was observed.
      options:
        - "Master CLI & Curses TUI (bin/zoth)"
        - "Zoth Dev Server (:8199) / Public Hub (:8088)"
        - "Cognitive Memory Daemon (:8788) & STDP Graph"
        - "Master Orchestrator Deck (:8484) & Unix PTY Engine"
        - "SimpleX E2EE Socket Relay (:5225) & Web Bridge (:8767)"
        - "Argon2id Keymaster Vault (:8787) / Rust Enclave"
        - "Web Workstations & 16-Brand UI / CSS Navigation Dock"
        - "3D WebGL / WebGPU Topologies & #つぶやきProcessing"
        - "Autonomous Agent Swarm DAG & AST Consensus Engine"
        - "ESP32-S3 Physical Companion Bridge (:8585)"
        - "Other / Packaging & Distro Installer"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 🔍 Bug Summary
      description: Provide a clear and concise description of the bug.
      placeholder: "When executing `zoth mem search ...`, the daemon returns an unexpected 500 error if..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Steps to Reproduce
      description: Detail the exact sequence of commands or browser clicks required to reproduce the bug.
      value: |
        1. Run `zoth start`
        2. Execute `zoth ...`
        3. Navigate to `http://127.0.0.1:8088/...`
        4. Observe the error behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 Expected Behavior
      description: What should have happened under expected operational parameters?
    validations:
      required: true

  - type: textarea
    id: actual_logs
    attributes:
      label: 📋 Terminal Logs & Diagnostics
      description: Paste relevant output from `zoth doctor`, daemon logs, browser DevTools console, or terminal backtraces.
      render: shell
      placeholder: |
        $ zoth doctor
        [DIAGNOSTICS OUTPUT]
    validations:
      required: false

  - type: input
    id: environment_os
    attributes:
      label: 💻 Operating System & Distro
      description: e.g., Parrot OS 6.0, Debian 12 (Bookworm), Ubuntu 24.04 LTS, Arch Linux, macOS Sonoma, Windows WSL2.
      placeholder: "Parrot OS Security Edition 6.1 (Linux 6.8.0)"
    validations:
      required: true

  - type: input
    id: environment_versions
    attributes:
      label: 📦 Software Versions
      description: Specify Zoth Studio version (`zoth --version`), Python version (`python3 --version`), and Node version (`node -v`).
      placeholder: "Zoth v3.2.0 | Python 3.11.9 | Node v20.12.2"
    validations:
      required: true

  - type: checkboxes
    id: verifications
    attributes:
      label: 🛡️ Sovereign Compliance & Verification
      description: Please verify the following statements before submitting.
      options:
        - label: "I have confirmed that the issue reproduces on the latest `v3.2.x` release."
          required: true
        - label: "I have scrubbed all personal identifying information (PII), absolute home paths, and private keys from this report."
          required: true
        - label: "This report does not describe an unpatched critical 0-day security vulnerability (use GitHub Private Vulnerability Reporting or security@nullai.tech instead)."
          required: true
