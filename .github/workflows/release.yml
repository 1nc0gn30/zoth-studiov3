name: 🚀 Publish Sovereign Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Complete Release Suite (Linux, Windows, macOS, Android)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain & MinGW
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: ☕ Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 make rsync tar zip curl

      - name: 🔐 Compile Rust Vault Daemons (Linux & Windows)
        run: |
          mkdir -p dist/release/windows dist/release/linux dist/release/macos dist/release/android
          
          # Linux Vault Daemon
          cd vault-daemon || cd core-app/vault-daemon
          cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/zoth-vault-daemon ../dist/release/zoth-vault-daemon-linux-x86_64
          chmod +x ../dist/release/zoth-vault-daemon-linux-x86_64
          
          # Windows Vault Daemon
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/zoth-vault-daemon.exe ../dist/release/windows/zoth-vault-daemon-windows-x86_64.exe
          
          cd ../dist/release
          tar -czvf zoth-vault-daemon-${{ github.ref_name }}-linux-x86_64.tar.gz zoth-vault-daemon-linux-x86_64
          cd windows
          zip zoth-vault-daemon-${{ github.ref_name }}-windows-x86_64.zip zoth-vault-daemon-windows-x86_64.exe
          cd ../..

      - name: 🐧 Build Full Linux Suite (.deb, .tar.gz, .run)
        run: |
          cd core-app || true
          if [ -f "scripts/build-linux-packages.sh" ]; then
            bash scripts/build-linux-packages.sh || true
          fi
          cd ..
          mkdir -p dist/release/linux
          if [ -d "core-app/dist-linux" ]; then
            cp core-app/dist-linux/* dist/release/linux/ || true
          fi

      - name: 🪟 Build Windows Suite (Portable ZIP & Launcher)
        run: |
          cd core-app || true
          if [ -f "scripts/build-windows-package.sh" ]; then
            bash scripts/build-windows-package.sh || true
          fi
          cd ..
          mkdir -p dist/release/windows
          if [ -d "core-app/dist-windows" ]; then
            cp core-app/dist-windows/* dist/release/windows/ || true
          fi
          if [ -d "core-app/public/dist/release/windows" ]; then
            cp core-app/public/dist/release/windows/* dist/release/windows/ || true
          fi

      - name: 🍎 Build macOS Universal Suite (.tar.gz & .zip)
        run: |
          cd core-app || true
          if [ -f "scripts/build-macos-package.sh" ]; then
            bash scripts/build-macos-package.sh || true
          fi
          cd ..
          mkdir -p dist/release/macos
          if [ -d "core-app/dist-macos" ]; then
            cp core-app/dist-macos/* dist/release/macos/ || true
          fi

      - name: 🤖 Build Android APK (Zoth Signal Bridge)
        run: |
          if [ -d "zoth-signal-bridge-android" ]; then
            cd zoth-signal-bridge-android
            chmod +x gradlew
            ./gradlew assembleDebug || true
            cd ..
            mkdir -p dist/release/android
            if [ -f "zoth-signal-bridge-android/app/build/outputs/apk/debug/app-debug.apk" ]; then
              cp zoth-signal-bridge-android/app/build/outputs/apk/debug/app-debug.apk dist/release/android/zoth-signal-bridge-${{ github.ref_name }}-android.apk
            fi
          fi

      - name: 📝 Generate Comprehensive Checksums
        run: |
          cd dist/release
          sha256sum zoth-vault-daemon* > SHA256SUMS.txt || true
          if [ -d "windows" ]; then
            cd windows && sha256sum * > SHA256SUMS.txt && cd ..
          fi
          if [ -d "linux" ]; then
            cd linux && sha256sum * > SHA256SUMS.txt && cd ..
          fi
          if [ -d "macos" ]; then
            cd macos && sha256sum * > SHA256SUMS.txt && cd ..
          fi
          if [ -d "android" ]; then
            cd android && sha256sum * > SHA256SUMS.txt && cd ..
          fi

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Zoth Studio ${{ github.ref_name }} — Sovereign Multi-Agent Workstation"
          body_path: core-app/public/dist/release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/release/zoth-vault-daemon-linux-x86_64
            dist/release/zoth-vault-daemon-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/release/SHA256SUMS.txt
            dist/release/windows/zoth-vault-daemon-windows-x86_64.exe
            dist/release/windows/zoth-vault-daemon-${{ github.ref_name }}-windows-x86_64.zip
            dist/release/windows/zoth-windows-x86_64.exe
            dist/release/windows/zoth-studio-*.zip
            dist/release/linux/Zoth_Studio-*.AppImage
            dist/release/linux/zoth-studio_*.deb
            dist/release/linux/zoth-linux-x86_64.run
            dist/release/linux/zoth-studio-*.tar.gz
            dist/release/macos/zoth-studio-*.tar.gz
            dist/release/macos/zoth-studio-*.zip
            dist/release/android/zoth-signal-bridge-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

