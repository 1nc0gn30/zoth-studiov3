      :root {
        /* Fibonacci Sequence Spacing Tokens */
        --fib-1: 1px;
        --fib-2: 2px;

        --fib-8: 8px;
        --fib-13: 13px;

      /* 3D Card Flipping & Arcana Perspective */
      .tarot-stage-perspective {
        perspective: 1200px;
        perspective-origin: center center;
      }
      .tarot-card-3d-wrap {
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        touch-action: manipulation;
      }
      .tarot-card-3d-wrap.is-flipped {
        transform: rotateY(180deg);
      }

      @media (max-width: 880px) {
        html, body, #root {
          overflow-x: hidden !important;
          min-height: 100dvh !important;
        }
        #root {
          padding: 0 !important;
        }
        .oracle-shell,
        main,
        .tarot-reader-container {
          overflow-y: auto !important;
          overflow-x: hidden !important;
          justify-content: flex-start !important;
          min-height: calc(100dvh - 30px) !important;
          height: auto !important;
          padding: var(--fib-21) !important;
          display: flex !important;
          flex-direction: column !important;
          gap: var(--fib-21) !important;
          box-sizing: border-box !important;
        }

        /* Card Container & Touch 3D Flipping */
        .tarot-card-flip,
        .tarot-card-container,
        img[src*="/tarot/"],
        [data-tarot-card] {
          border-radius: var(--radius-fib-lg, 18px) !important;
          transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease !important;
          touch-action: manipulation !important;
          cursor: pointer !important;
          box-shadow: 0 0 28px rgba(232, 200, 114, 0.35), 0 18px 48px rgba(0, 0, 0, 0.85) !important;
          border: 1px solid rgba(232, 200, 114, 0.4) !important;
          max-width: 100% !important;
          margin: 0 auto !important;
          animation: gold-aura-breathe 4s ease-in-out infinite !important;
          transform-style: preserve-3d !important;
          -webkit-backface-visibility: hidden !important;
          backface-visibility: hidden !important;
        }

        .tarot-card-flip:active,
        .tarot-card-container:active,
        img[src*="/tarot/"]:active {
          transform: scale(0.97) rotateY(180deg) !important;
          box-shadow: 0 0 45px rgba(232, 200, 114, 0.7), 0 0 80px rgba(232, 200, 114, 0.35) !important;
        }

        /* Gold Aura Halo Shimmer Animation */
        @keyframes gold-aura-breathe {
          0%, 100% {
            box-shadow: 0 0 24px rgba(232, 200, 114, 0.3), 0 0 50px rgba(232, 200, 114, 0.12), inset 0 0 16px rgba(232, 200, 114, 0.1);
            border-color: rgba(232, 200, 114, 0.35);

          50% {

        }

        button,

        select,
        textarea {
          min-height: 48px !important;
          font-size: 16px !important; /* Prevents auto-zoom on iOS */
          touch-action: manipulation !important;
