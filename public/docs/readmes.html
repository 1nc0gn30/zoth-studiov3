<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Zoth Studio — README library</title>
  <meta name="description" content="Renders the Zoth Studio product README and topic manuals (HUD, workstations, themes, Signal/SimpleX) as pages on the hub."/>
  <link rel="canonical" href="https://zoth.nullai.tech/docs/readmes.html"/>
  <meta name="theme-color" content="#030306"/>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/zoth-seal-hermetic-on-dark.svg"/>
  <link href="/assets/zoth-theme.css?v=13" rel="stylesheet"/>
  <script src="/assets/zoth-theme.js?v=13"></script>
  <link href="/assets/zoth-nav.css?v=16" rel="stylesheet"/>
  <link href="/assets/zoth-footer.css" rel="stylesheet"/>
  <link href="/docs/readmes.css" rel="stylesheet"/>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main id="main-content" class="md-lib">
    <nav class="md-nav" id="md-nav" aria-label="README library"></nav>
    <article class="md-article" id="md-article">
      <p>Loading…</p>
    </article>
  </main>
  <script src="/assets/zoth-md.js"></script>
  <script>
  (function () {
    var nav = document.getElementById('md-nav');
    var article = document.getElementById('md-article');
    function paramDoc() {
      var q = new URLSearchParams(location.search);
      return (q.get('doc') || 'readme').replace(/\.md$/i, '');
    }
    function fileFor(id, catalog) {
      var hit = catalog.docs.filter(function (d) { return d.id === id || d.file.replace(/\.md$/i, '') === id; })[0];
      return hit || catalog.docs[0];
    }
    function renderNav(catalog, current) {
      var groups = {};
      catalog.docs.forEach(function (d) {
        groups[d.group] = groups[d.group] || [];
        groups[d.group].push(d);
      });
      var html = '';
      Object.keys(groups).forEach(function (g) {
        html += '<h2>' + g + '</h2>';
        groups[g].forEach(function (d) {
          var on = d.id === current.id ? ' is-on' : '';
          html += '<a class="' + on + '" href="/docs/readmes.html?doc=' + encodeURIComponent(d.id) + '">' + d.title + '<small>' + (d.blurb || '') + '</small></a>';
        });
      });
      nav.innerHTML = html;
    }
    fetch('/docs/catalog.json').then(function (r) { return r.json(); }).then(function (catalog) {
      var current = fileFor(paramDoc(), catalog);
      renderNav(catalog, current);
      document.title = current.title + ' — Zoth README library';
      return fetch('/docs/' + current.file).then(function (r) {
        if (!r.ok) throw new Error('Missing ' + current.file);
        return r.text();
      }).then(function (md) {
        article.innerHTML = window.ZothMd.render(md);
      });
    }).catch(function (err) {
      article.innerHTML = '<p class="md-err">' + (err && err.message ? err.message : 'Could not load README') + '</p>';
    });
  })();
  </script>
  <script defer src="/assets/zoth-nav.js?v=18"></script>
  <script defer src="/assets/zoth-gate.js"></script>
</body>
</html>
