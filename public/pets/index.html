    <style>
      .hangar-roster {
        display: none;
        list-style: none;
        margin: 0;
        padding: 18px var(--pad, 18px) 40px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 28px 16px;
        position: relative;
        z-index: 5;
      }
      .hangar-roster button {
        appearance: none;
        background: none;
        border: 0;
        color: #f7f4ee;
        cursor: pointer;
        text-align: center;
        padding: 0;
        font: inherit;
      }
      .hangar-roster img {
        width: 62%;
        margin: 0 auto;
        aspect-ratio: 1;
        object-fit: contain;
        mix-blend-mode: screen;
        filter: contrast(1.08) saturate(1.1);
      }
      .hangar-roster b {
        display: block;
        margin-top: 8px;
        font-family: Fraunces, Palatino, serif;
        font-size: 1rem;
        font-weight: 600;
      }
      .hangar-roster span {
        display: block;
        margin-top: 2px;
        color: #a8a4c2;
        font-size: 0.72rem;
      }
      body.hangar-flat {
        overflow: auto !important;
        height: auto !important;
        background: #050508;
      }
      body.hangar-flat #gl,
      body.hangar-flat #veil { display: none !important; }
      body.hangar-flat .hangar-roster { display: grid; }
      body.hangar-flat .reg-bar {
        background: rgba(5, 5, 8, 0.92);
        border-bottom-color: rgba(232, 200, 114, 0.22);
      }
      body.hangar-flat .reg-links a:hover,
      body.hangar-flat .cats button.is-on { color: #14110a; background: #e8c872; border-color: #e8c872; }
      @media (max-width: 860px) {
        .hangar-roster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        html, body { overflow: auto !important; height: auto !important; }
        #gl, #veil { display: none !important; }
        .reg-bar { grid-template-columns: 1fr auto; }
        .reg-links { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-label="3D pet hangar"></canvas>
    <div id="veil" aria-hidden="true"></div>
    <div class="hud">
      <header class="reg-bar">
        <a class="brand" href="/">
          <img src="/assets/brand/zoth-seal-hermetic-on-dark.svg" width="28" height="28" alt="" />
          <span>PETS</span>
          <em class="brand-by">A NullAI studio</em>
        </a>
        <div class="reg-meta">
          <span id="count">15</span>
          <span class="src" id="src">packs</span>
        </div>
        <nav class="reg-links" aria-label="Hub">
          <a href="/">Deck</a>
          <a href="/pets/pet-model-studio.html">Studio</a>
          <a href="/vault/">Vault</a>
          <a class="js-hub" href="/">Hub</a>
        </nav>
      </header>
      <div class="cats" id="cats" role="tablist" aria-label="Domains"></div>
    </div>
    <ul class="hangar-roster" id="hangar-roster"></ul>
    <div class="tip" id="tip" hidden></div>

    <aside class="inspect" id="inspect" hidden>
      <button type="button" class="inspect-close" id="inspect-close" aria-label="Close">×</button>
      <img class="inspect-portrait" id="inspect-portrait" alt="" width="96" height="96" />
      <p class="inspect-kicker" id="inspect-cat"></p>
      <h2 id="inspect-name"></h2>
      <p class="inspect-role" id="inspect-role"></p>
      <p id="inspect-desc"></p>
      <div class="inspect-tags" id="inspect-tags"></div>
      <h3 class="inspect-sub">Knowledge</h3>
      <p class="inspect-health" id="inspect-health"></p>
      <ul class="inspect-docs" id="inspect-docs"></ul>
      <h3 class="inspect-sub">Engage prompt</h3>
      <pre class="inspect-engage" id="inspect-engage"></pre>
      <div class="inspect-actions">
        <button type="button" class="inspect-copy" id="inspect-engage-btn">Engage in chat</button>
        <button type="button" class="inspect-copy" id="inspect-copy">Copy engage prompt</button>
      </div>
      <p class="inspect-note">Live runs stay on the private deck. This hangar is the public roster.</p>
    </aside>
