      <h2 id="inspect-name"></h2>
      <p class="inspect-role" id="inspect-role"></p>
      <p id="inspect-desc"></p>
      <div class="inspect-tags" id="inspect-tags"></div>
      <h3 class="inspect-sub">Knowledge</h3>
      <p class="inspect-health" id="inspect-health"></p>
      <ul class="inspect-docs" id="inspect-docs"></ul>
      <h3 class="inspect-sub">Engage prompt</h3>
      <pre class="inspect-engage" id="inspect-engage"></pre>
      <div class="inspect-actions">
        <button type="button" class="inspect-copy" id="inspect-engage-btn">Engage in chat</button>
        <button type="button" class="inspect-copy" id="inspect-copy">Copy engage prompt</button>
      </div>
      <p class="inspect-note">Live runs stay on the private deck. This hangar is the public roster.</p>
    </aside>
