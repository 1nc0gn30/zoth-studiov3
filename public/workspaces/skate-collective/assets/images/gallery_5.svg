<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#08080b"/>
  <!-- Midnight Concrete Pouring / DIY Spot Build -->
  <defs>
    <linearGradient id="goldTrowel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Cement block and Masonry Trowel -->
  <polygon points="200,420 580,380 620,490 240,540" fill="#1e1e24" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="320,340 440,290 460,320 340,370" fill="url(#goldTrowel)" stroke="#fef08a" stroke-width="2"/>
  <line x1="380" y1="315" x2="340" y2="270" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <!-- Quickcrete Bag & Torch Glow -->
  <circle cx="500" cy="200" r="100" fill="#fbbf24" opacity="0.15"/>
  <text x="30" y="565" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" letter-spacing="2">MIDNIGHT CEMENT // DIY LEDGE POURING</text>
  <text x="30" y="585" font-family="Space Grotesk, sans-serif" font-size="11" fill="#a1a1aa" letter-spacing="1">CREW: OBSIDIAN BUILD SQUAD • FAST-SETTING 5000 PSI</text>
</svg>