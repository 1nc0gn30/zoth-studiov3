<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0c0c10"/>
  <!-- High contrast night session: 12-Stair Backside Smith -->
  <defs>
    <radialGradient id="spotlight" cx="45%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#spotlight)"/>
  <!-- Rail & Stair Geometry -->
  <path d="M 100,550 L 350,550 L 650,220 L 750,220" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="550" x2="220" y2="590" stroke="#52525b" stroke-width="6"/>
  <line x1="420" y1="440" x2="420" y2="590" stroke="#52525b" stroke-width="6"/>
  <line x1="580" y1="290" x2="580" y2="590" stroke="#52525b" stroke-width="6"/>
  <!-- Skater in silhouette / gold rim -->
  <circle cx="480" cy="280" r="20" fill="#fef08a" opacity="0.9"/>
  <path d="M480,300 L470,340 L450,380 M480,320 L510,350 L530,340 M460,340 L430,360" stroke="#fef08a" stroke-width="8" stroke-linecap="round" fill="none"/>
  <rect x="430" y="370" width="80" height="12" rx="4" fill="#fbbf24" transform="rotate(-35 470 376)"/>
  <circle cx="440" cy="390" r="8" fill="#fbbf24"/>
  <circle cx="500" cy="350" r="8" fill="#fbbf24"/>
  <!-- Sparks -->
  <circle cx="445" cy="385" r="2" fill="#fff"/>
  <circle cx="450" cy="395" r="3" fill="#fbbf24"/>
  <circle cx="435" cy="398" r="2" fill="#fff"/>
  <!-- Fisheye Vignette -->
  <circle cx="400" cy="300" r="360" fill="none" stroke="#070709" stroke-width="80" opacity="0.75"/>
  <text x="30" y="565" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" letter-spacing="2">BS SMITH GRIND // 10-STAIR KINKED RAIL</text>
  <text x="30" y="585" font-family="Space Grotesk, sans-serif" font-size="11" fill="#a1a1aa" letter-spacing="1">RIDER: KAELEN VANCE • 35MM LEICA M6 • 1/1000s F/2.8</text>
</svg>