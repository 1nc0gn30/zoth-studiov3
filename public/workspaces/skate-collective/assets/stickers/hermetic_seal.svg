<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#09090b" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Sacred Hexagram & Eye -->
  <polygon points="100,28 160,132 40,132" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <polygon points="100,172 160,68 40,68" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="16" fill="#09090b" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="100" cy="100" r="6" fill="url(#gold)"/>
  <!-- Text around -->
  <path id="textPath" d="M 30,100 A 70,70 0 1,1 170,100" fill="none"/>
  <text font-family="Cinzel, serif" font-size="10" font-weight="bold" fill="url(#gold)" letter-spacing="3">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">OBSIDIAN • COLLECTIVE • MMXXVI</textPath>
  </text>
  <text x="100" y="162" font-family="Cinzel, serif" font-size="8" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="2">NO SPONSORS</text>
</svg>