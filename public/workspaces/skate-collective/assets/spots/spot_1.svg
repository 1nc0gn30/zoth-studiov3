<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#0c0c11"/>
  <!-- The Vault 8-Stair & Kinked Rail -->
  <path d="M50,350 L200,350 L450,150 L550,150" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="350" x2="180" y2="390" stroke="#71717a" stroke-width="4"/>
  <line x1="320" y1="250" x2="320" y2="390" stroke="#71717a" stroke-width="4"/>
  <line x1="460" y1="150" x2="460" y2="390" stroke="#71717a" stroke-width="4"/>
  <!-- Stair steps -->
  <path d="M 100,380 L 150,380 L 150,350 L 200,350 L 200,320 L 250,320 L 250,290 L 300,290 L 300,260 L 350,260 L 350,230 L 400,230 L 400,200 L 450,200 L 450,170 L 550,170 L 550,400 L 100,400 Z" fill="#181822" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
  <!-- Badge -->
  <rect x="30" y="30" width="130" height="28" rx="4" fill="#1c1917" stroke="#ef4444" stroke-width="1.5"/>
  <text x="95" y="49" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">BUST: HEAVY (NIGHT ONLY)</text>
  <text x="30" y="350" font-family="Cinzel, serif" font-size="20" font-weight="bold" fill="#fbbf24">THE VAULT 8-STAIR</text>
  <text x="30" y="375" font-family="Space Grotesk, sans-serif" font-size="12" fill="#e4e4e7">POLISHED GRANITE RUN-UP • SQUARE KINKED RAIL</text>
</svg>