      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Zoth Tool Registry",
        "url": "https://zoth.nullai.tech/registry/",
        "description": "Searchable index of local Zoth tools and projects.",
        "isPartOf": { "@type": "WebSite", "name": "Zoth Studio", "url": "https://zoth.nullai.tech/" }
      }
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

      <link rel="stylesheet" href="/assets/zoth-mobile.css" />
  </head>
  <body>
    <canvas id="gl" aria-label="3D tool registry wall"></canvas>
    <div id="veil" aria-hidden="true"></div>
    <div class="hud">
      <header class="reg-bar">
        <a class="brand" href="/">
          <img src="/assets/brand/zoth-seal-hermetic-on-dark.svg" width="28" height="28" alt="" />
          <span>REGISTRY</span>
          <em class="brand-by">A NullAI studio</em>
        </a>
        <label class="seek">
          <span class="visually-hidden">Search tools</span>
          <input type="search" id="q" placeholder="Search the fleet…" autocomplete="off" />
        </label>
        <div class="reg-meta">
          <span id="count">—</span>
          <span class="src" id="src">snapshot</span>
        </div>
        <nav class="reg-links" aria-label="Hub">
          <a href="/">Hub</a>
          <a href="/studio/">Studio</a>
          <a href="/vault/">Vault</a>
        </nav>
      </header>

      <!-- Mobile-Only Desktop Insight Tooltip / Banner -->
      <div class="mobile-desktop-insight" role="note">
        <span class="insight-icon">💡</span>
        <div class="insight-text">
          <strong>Mobile Focused Mode Active</strong>
          <span>Optimized for touch & speed. Want full multi-pane orchestration & local hardware key tooling? Open on desktop.</span>
        </div>
        <button class="insight-close" type="button" aria-label="Dismiss insight" onclick="this.parentElement.style.display='none'">✕</button>
      </div>

      <div class="cats" id="cats" role="tablist" aria-label="Categories"></div>
    </div>
    <div class="tip" id="tip" hidden></div>

    <aside class="inspect" id="inspect" hidden>
      <button type="button" class="inspect-close" id="inspect-close" aria-label="Close">×</button>
      <p class="inspect-kicker" id="inspect-cat"></p>
      <h2 id="inspect-name"></h2>
      <p id="inspect-desc"></p>
      <dl>
        <div>
          <dt>Runtimes</dt>
          <dd id="inspect-run"></dd>
        </div>
        <div>
          <dt>Path</dt>
          <dd><code id="inspect-path"></code></dd>
        </div>
      </dl>
      <div class="inspect-tags" id="inspect-tags"></div>
      <p class="inspect-note">Live runs stay on the private deck. This wall is the public index.</p>
    </aside>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script src="/registry/registry.js?v=20260813i" type="module"></script>
    <script src="/assets/celestial-trail.js"></script>
  <script src="/assets/zoth-gate.js"></script>
</body>
</html>
