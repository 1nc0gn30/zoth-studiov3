        border-radius: 10px;
        overflow: hidden;

      .editor-topbar {
        background: rgba(14, 20, 36, 0.95);

        padding: 8px 14px;
        display: flex;
        justify-content: space-between;

        font-size: 0.75rem;

        padding: 16px;

        padding: 10px 18px;

        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;

        box-shadow: 0 0 20px var(--edge-cyan);

        border: 1px solid var(--edge-border);

    <script>
      const TEMPLATES = {
        ratelimit: `export default async function handler(req: Request): Promise<Response> {
  const ip = req.headers.get('x-forwarded-for') || '127.0.0.1';
  const clientHash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ip));
  const hexHash = Array.from(new Uint8Array(clientHash)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);

  // Sliding window token-bucket rate limiter
  return new Response(JSON.stringify({
    status: 'ok',
    client_hash: hexHash,
    worker: 'zoth-edge-iad1',
    rate_limit_remaining: 98,
    runtime: 'v8-isolate',
    latency_ms: 1.42
  }), {
    headers: { 'Content-Type': 'application/json', 'X-RateLimit-Limit': '100' }
  });
}`,
        aeo: `export default async function handler(req: Request): Promise<Response> {
  const response = await fetch(req);
  const jsonLdGraph = {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Zoth Studio",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Linux, Windows",
    "offers": { "@type": "Offer", "price": "0.00", "priceCurrency": "USD" }
  };

  // Edge-injected structured AEO schema
  return new Response(JSON.stringify(jsonLdGraph, null, 2), {
    headers: { 'Content-Type': 'application/ld+json' }
  });
}`,
        solana: `export default async function handler(req: Request): Promise<Response> {
  // Ultra-low latency Solana RPC reverse proxy with cache headers
  const rpcBody = await req.json();
  const allowedMethods = ['getAccountInfo', 'getLatestBlockhash', 'getBalance'];

  if (!allowedMethods.includes(rpcBody.method)) {
    return new Response(JSON.stringify({ error: 'Method not permitted on edge gate' }), { status: 403 });
  }

  return new Response(JSON.stringify({
    jsonrpc: '2.0',
    result: { value: { lamports: 5000000000, owner: '11111111111111111111111111111111' } },
    id: rpcBody.id
  }), { headers: { 'Content-Type': 'application/json', 'Cache-Control': 'public, max-age=2' } });
}`,
        auth: `export default async function handler(req: Request): Promise<Response> {
  const authHeader = req.headers.get('Authorization');
  if (!authHeader || !authHeader.startsWith('Bearer ')) {
    return new Response(JSON.stringify({ error: 'Unauthorized: Missing Sovereign Bearer Token' }), { status: 401 });
  }

  // Stateless Ed25519 Token signature verification
  return new Response(JSON.stringify({
    authenticated: true,
    principal: 'zoth-master-operator',
    roles: ['admin', 'swarm-arbiter'],
    issued_at: new Date().toISOString()
  }), { headers: { 'Content-Type': 'application/json' } });
}`,
        stream: `export default async function handler(req: Request): Promise<Response> {
  const { readable, writable } = new TransformStream();
  const writer = writable.getWriter();
  const encoder = new TextEncoder();

  // Async Chunked Streaming Response
  (async () => {
    await writer.write(encoder.encode("data: {\"event\": \"connected\", \"node\": \"IAD1\"}\\n\\n"));
    await writer.write(encoder.encode("data: {\"event\": \"ast_verified\", \"status\": 1}\\n\\n"));
    await writer.close();
  })();

  return new Response(readable, {
    headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache' }
  });
}`
      };

      function loadTemplate(key) {
        document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = Array.from(document.querySelectorAll('.tpl-btn')).find(b => b.getAttribute('onclick').includes(key));
        if (activeBtn) activeBtn.classList.add('active');

        document.getElementById('edge-code-area').value = TEMPLATES[key] || TEMPLATES.ratelimit;
        updateCharCount();
      }

      function updateCharCount() {
        const text = document.getElementById('edge-code-area').value;
        const lines = text.split('\n').length;
        document.getElementById('editor-char-count').textContent = `${text.length} chars · ${lines} lines`;
      }

      function deployToEdge() {
        const msg = document.getElementById('deploy-msg');
        msg.textContent = 'Compiling V8 bytecode across 8 edge nodes...';
        setTimeout(() => {
          msg.textContent = '✓ Deployed to 8 Global Edge Clusters in 48ms!';
          setTimeout(() => { msg.textContent = ''; }, 3500);
        }, 500);
      }

      function runDryRunTest() {
        const log = document.getElementById('test-output-log');
        const badge = document.getElementById('test-status-badge');
        badge.textContent = 'Executing V8 Isolate...';
        badge.style.color = 'var(--edge-gold)';

        setTimeout(() => {
          badge.textContent = 'HTTP 200 OK · 1.42ms';
          badge.style.color = 'var(--edge-emerald)';
          log.textContent = JSON.stringify({
            status: 'ok',
            worker: 'zoth-edge-iad1',
            runtime: 'v8-isolate-sandboxed',
            latency_ms: 1.42,
            memory_used_kb: 148,
            timestamp: new Date().toISOString(),
            headers: {
              'x-edge-cluster': 'IAD1',
              'x-runtime': 'v8-isolate-2026',
              'content-type': 'application/json'
            }
          }, null, 2);
        }, 250);
      }

      window.addEventListener('DOMContentLoaded', () => {
        loadTemplate('ratelimit');
      });
    </script>
