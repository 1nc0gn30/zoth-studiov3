<!-- ============================================================
     "Constellation Ledger" ticker — drop-in snippet
     WHAT: self-contained marquee of supported model provider logos
           (CSS marquee + one staggered ignition; JS is class toggles
           only). Full story: README.md in this directory.
     REPLACE: the .sovereign-stack block in /public/zoth/index.html.
     WIRE-IN (both required, inside <head> or before   <script src="/assets/zoth-theme.js?v=10"></script>

<link rel="stylesheet" href="/assets/zoth-theme.css?v=10">
<link rel="stylesheet" href="/assets/zoth-nav.css?v=10">
<script src="/assets/zoth-theme.js?v=10"></script>
<script src="/assets/zoth-nav.js?v=10" defer></script>

</body>):
       <link rel="stylesheet" href="/assets/ticker-collab/ticker.css" />
       <script src="/assets/ticker-collab/ticker.js" defer></script>
     NOTE: everything below the <section> tag must stay byte-identical
     to preview.html's copy (verbatim-parity contract).

     Per-logo modifier classes (--grok / --cerebras / --deepseek) carry the
     optical-weight normalization from ticker.css §5. -->
<section id="tk-ticker" class="tk-stack" aria-label="Supported model providers">
  <div class="tk-head">
    <span class="tk-label">RUNS WITH THE SOVEREIGN STACK</span>
    <span class="tk-rule"></span>
  </div>
  <div class="tk-marquee">
    <div class="tk-track">
      <a href="#tk-ticker" class="tk-logo" aria-label="Claude — supported model provider" style="--i:0"><img src="/assets/logos/anthropic-claude.svg" alt="" loading="lazy" /><span class="tk-name">Claude</span></a>
      <a href="#tk-ticker" class="tk-logo" aria-label="Gemini — supported model provider" style="--i:1"><img src="/assets/logos/google-gemini.svg" alt="" loading="lazy" /><span class="tk-name">Gemini</span></a>
      <a href="#tk-ticker" class="tk-logo tk-logo--grok" aria-label="Grok — supported model provider" style="--i:2"><img src="/assets/logos/xai-grok.svg" alt="" loading="lazy" /><span class="tk-name">Grok</span></a>
      <a href="#tk-ticker" class="tk-logo tk-logo--deepseek" aria-label="DeepSeek — supported model provider" style="--i:3"><img src="/assets/logos/deepseek.svg" alt="" loading="lazy" /><span class="tk-name">DeepSeek</span></a>
      <a href="#tk-ticker" class="tk-logo tk-logo--cerebras" aria-label="Cerebras — supported model provider" style="--i:4"><img src="/assets/logos/cerebras-wafer.svg" alt="" loading="lazy" /><span class="tk-name">Cerebras</span></a>
      <a href="#tk-ticker" class="tk-logo" aria-label="Nous Research — supported model provider" style="--i:5"><img src="/assets/logos/nous-research.svg" alt="" loading="lazy" /><span class="tk-name">Nous Research</span></a>

      <!-- duplicate set for seamless loop; hidden from AT, display-hidden under reduced motion -->
      <span class="tk-logo tk-logo--dup" aria-hidden="true" style="--i:0"><img src="/assets/logos/anthropic-claude.svg" alt="" loading="lazy" /><span class="tk-name">Claude</span></span>
      <span class="tk-logo tk-logo--dup" aria-hidden="true" style="--i:1"><img src="/assets/logos/google-gemini.svg" alt="" loading="lazy" /><span class="tk-name">Gemini</span></span>
      <span class="tk-logo tk-logo--dup tk-logo--grok" aria-hidden="true" style="--i:2"><img src="/assets/logos/xai-grok.svg" alt="" loading="lazy" /><span class="tk-name">Grok</span></span>
      <span class="tk-logo tk-logo--dup tk-logo--deepseek" aria-hidden="true" style="--i:3"><img src="/assets/logos/deepseek.svg" alt="" loading="lazy" /><span class="tk-name">DeepSeek</span></span>
      <span class="tk-logo tk-logo--dup tk-logo--cerebras" aria-hidden="true" style="--i:4"><img src="/assets/logos/cerebras-wafer.svg" alt="" loading="lazy" /><span class="tk-name">Cerebras</span></span>
      <span class="tk-logo tk-logo--dup" aria-hidden="true" style="--i:5"><img src="/assets/logos/nous-research.svg" alt="" loading="lazy" /><span class="tk-name">Nous Research</span></span>
    </div>
  </div>
</section>
