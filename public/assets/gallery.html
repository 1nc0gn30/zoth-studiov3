      z-index: 0;

      border: 1px solid transparent;

      color: var(--cyan);
      border-color: var(--border);
      background: rgba(0, 240, 255, 0.05);

      outline: none;
      transition: border-color 0.2s;

    .search-input:focus {

      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;

    .filter-tabs {

      gap: 0.5rem;
      flex-wrap: wrap;

    .tab-btn {

      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;

      color: #05070d;
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);

      gap: 1.75rem;

      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;

      border-color: var(--cyan);

    // Web Audio Synthesizer
    let audioCtx = null;
    function playChime(freq = 520) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } catch (e) {}
    }

        if (!query) return matchesFilter;

        const matchesQuery = item.title.toLowerCase().includes(query) ||
          item.tags.some(t => t.toLowerCase().includes(query));
        return matchesFilter && matchesQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-dim);">No assets found matching your query.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="asset-card">
          <div class="asset-preview-stage">
            <img src="${item.src}" alt="${item.title}" loading="lazy">
          </div>
          <div class="asset-info">
            <h3 class="asset-title">${item.title}</h3>
            <span class="asset-category">${item.category} · ${item.type.toUpperCase()}</span>
            <div class="asset-actions">
              <a href="${item.src}" download class="btn-action" onclick="playChime(660)">Download</a>
              <button class="btn-action" onclick="copyAssetUrl('${item.src}')">Copy URL</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.copyAssetUrl = function(url) {
      const full = window.location.origin + url;
      navigator.clipboard.writeText(full);
      playChime(880);
      alert('Copied asset URL to clipboard: ' + full);
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderAssets();

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderAssets();
      });

      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(t => {
        t.addEventListener('click', () => {
          tabs.forEach(btn => btn.classList.remove('is-active'));
          t.classList.add('is-active');
          currentFilter = t.getAttribute('data-filter');
          playChime(440);
          renderAssets();
        });
      });
    });
  </script>
  <script src="/assets/celestial-trail.js"></script>
</body>
</html>
