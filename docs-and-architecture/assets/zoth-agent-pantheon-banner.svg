<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 140" width="100%" height="140">
  <defs>
    <linearGradient id="pantheonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070914" />
      <stop offset="50%" stop-color="#0f1429" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c872">
        <animate attributeName="stop-color" values="#e8c872;#00f0ff;#a855f7;#e8c872" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#a855f7;#e8c872;#00f0ff" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#e8c872;#00f0ff;#a855f7" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="pantheonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="1092" height="132" rx="12" fill="url(#pantheonBg)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Center Master Azoth Sun Core -->
  <g transform="translate(550, 70)">
    <circle r="36" fill="none" stroke="#e8c872" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle r="28" fill="#1b1730" stroke="#e8c872" stroke-width="2" filter="url(#pantheonGlow)" />
    <text x="0" y="4" fill="#e8c872" font-family="'Syne', sans-serif, monospace" font-size="11" font-weight="900" text-anchor="middle">AZOTH</text>
    <text x="0" y="16" fill="#a8a4c2" font-family="monospace" font-size="7.5" text-anchor="middle">PRIME CORE</text>
  </g>

  <!-- Left Flank: Deep Research & Code Synthesis -->
  <g transform="translate(180, 70)">
    <circle r="22" fill="#0c172f" stroke="#00f0ff" stroke-width="1.8" filter="url(#pantheonGlow)">
      <animate attributeName="stroke" values="#00f0ff;#38bdf8;#00f0ff" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="4" fill="#00f0ff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ANTIGRAVITY</text>
    <text x="0" y="14" fill="#94a3b8" font-family="monospace" font-size="6.5" text-anchor="middle">DEEPMIND AGY</text>
    <line x1="26" y1="0" x2="330" y2="0" stroke="#00f0ff" stroke-opacity="0.3" stroke-dasharray="4 4" />
  </g>

  <g transform="translate(360, 42)">
    <circle r="18" fill="#141e33" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="0" y="3" fill="#8b5cf6" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">HERMES 3</text>
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">NOUS RESEARCH</text>
  </g>

  <g transform="translate(360, 98)">
    <circle r="18" fill="#1c0f24" stroke="#ff0055" stroke-width="1.5" />
    <text x="0" y="3" fill="#ff0055" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">GROK</text>
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">xAI REALTIME</text>
  </g>

  <!-- Right Flank: Security & Offline Execution -->
  <g transform="translate(740, 42)">
    <circle r="18" fill="#1f1015" stroke="#ef4444" stroke-width="1.5" />
    <text x="0" y="3" fill="#ef4444" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">DRACO</text>
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">AST FUSION</text>
  </g>

  <g transform="translate(740, 98)">
    <circle r="18" fill="#09241b" stroke="#34d399" stroke-width="1.5" />
    <text x="0" y="3" fill="#34d399" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">LYCAN</text>
    <text x="0" y="12" fill="#94a3b8" font-family="monospace" font-size="6" text-anchor="middle">OWASP GUARD</text>
  </g>

  <g transform="translate(920, 70)">
    <circle r="22" fill="#161233" stroke="#a855f7" stroke-width="1.8" filter="url(#pantheonGlow)">
      <animate attributeName="stroke" values="#a855f7;#c084fc;#a855f7" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="4" fill="#c084fc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">ZOTH-MICRO</text>
    <text x="0" y="14" fill="#94a3b8" font-family="monospace" font-size="6.5" text-anchor="middle">1.5B OFFLINE</text>
    <line x1="-330" y1="0" x2="-26" y2="0" stroke="#a855f7" stroke-opacity="0.3" stroke-dasharray="4 4" />
  </g>

  <!-- Far Edge Labels -->
  <text x="24" y="24" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">⚡ 21-AGENT AUTONOMOUS PANTHEON</text>
  <text x="1076" y="24" fill="#e8c872" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">CONVERGENT CONSENSUS BUS 🟢</text>
</svg>
