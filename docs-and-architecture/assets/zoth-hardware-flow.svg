<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#051c14" />
      <stop offset="50%" stop-color="#0c2b20" />
      <stop offset="100%" stop-color="#051c14" />
    </linearGradient>
    <filter id="hwGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="992" height="112" rx="10" fill="url(#hwBg)" stroke="#34d399" stroke-width="1.6" />

  <!-- Node 1: Workstation Host -->
  <g transform="translate(30, 20)">
    <rect width="180" height="80" rx="8" fill="#091829" stroke="#00f0ff" stroke-width="1.5" />
    <text x="90" y="28" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">💻 WORKSTATION</text>
    <text x="90" y="48" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">Operator Deck (:8484)</text>
    <text x="90" y="66" fill="#38bdf8" font-family="monospace" font-size="8.5" text-anchor="middle">Python Bridge Engine</text>
  </g>

  <!-- Flow 1 -->
  <g transform="translate(215, 60)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </line>
    <polygon points="60,0 52,-4 52,4" fill="#34d399" />
    <text x="30" y="-8" fill="#34d399" font-family="monospace" font-size="8" text-anchor="middle">115200 Baud</text>
  </g>

  <!-- Node 2: ESP32-S3 Core -->
  <g transform="translate(285, 20)">
    <rect width="210" height="80" rx="8" fill="#06261b" stroke="#34d399" stroke-width="1.8" filter="url(#hwGlow)" />
    <text x="105" y="28" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">📟 ESP32-S3 COMPANION</text>
    <text x="105" y="48" fill="#a7f3d0" font-family="monospace" font-size="9" text-anchor="middle">Dual Xtensa @ 240MHz</text>
    <text x="105" y="66" fill="#6ee7b7" font-family="monospace" font-size="8.5" text-anchor="middle">Bidirectional JSON Parser</text>
  </g>

  <!-- Flow 2 -->
  <g transform="translate(500, 60)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </line>
    <polygon points="55,0 47,-4 47,4" fill="#34d399" />
    <text x="27" y="-8" fill="#34d399" font-family="monospace" font-size="8" text-anchor="middle">DMA SPI / I2S</text>
  </g>

  <!-- Node 3: ST7789 IPS Display -->
  <g transform="translate(565, 20)">
    <rect width="180" height="80" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="90" y="28" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🖥️ ST7789 IPS LCD</text>
    <text x="90" y="48" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">240x320 @ 60 FPS</text>
    <text x="90" y="66" fill="#7dd3fc" font-family="monospace" font-size="8.5" text-anchor="middle">Animated Mascot Face</text>
  </g>

  <!-- Flow 3 -->
  <g transform="translate(750, 60)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#e8c872" stroke-width="2" stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" values="14;0" dur="1s" repeatCount="indefinite" />
    </line>
    <polygon points="45,0 37,-4 37,4" fill="#e8c872" />
  </g>

  <!-- Node 4: ES8311 I2S Audio -->
  <g transform="translate(805, 20)">
    <rect width="165" height="80" rx="8" fill="#1c160a" stroke="#e8c872" stroke-width="1.5" />
    <text x="82" y="28" fill="#e8c872" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">🔊 ES8311 AUDIO</text>
    <text x="82" y="48" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">24-Bit DAC / PA Amp</text>
    <text x="82" y="66" fill="#fcd34d" font-family="monospace" font-size="8.5" text-anchor="middle">TTS Vocal Chimes</text>
  </g>
</svg>
