<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0d1326" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070a14" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00f0ff;#e8c872;#a855f7;#00f0ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#e8c872" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#e8c872;#a855f7;#00f0ff;#e8c872" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#a855f7;#00f0ff;#e8c872;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="hudGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect x="4" y="4" width="992" height="72" rx="10" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Grid lines -->
  <line x1="250" y1="12" x2="250" y2="68" stroke="#00f0ff" stroke-opacity="0.15" stroke-dasharray="3 3" />
  <line x1="500" y1="12" x2="500" y2="68" stroke="#00f0ff" stroke-opacity="0.15" stroke-dasharray="3 3" />
  <line x1="750" y1="12" x2="750" y2="68" stroke="#00f0ff" stroke-opacity="0.15" stroke-dasharray="3 3" />

  <!-- Metric 1: Hub & Swarm Router -->
  <g transform="translate(30, 24)">
    <circle cx="10" cy="16" r="5" fill="#00f0ff" filter="url(#hudGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="#a8a4c2" font-family="monospace" font-size="11" font-weight="600">PUBLIC HUB &amp; SUITES</text>
    <text x="24" y="32" fill="#00f0ff" font-family="monospace" font-size="15" font-weight="bold">PORT :8088 🟢 LIVE</text>
  </g>

  <!-- Metric 2: Operator Deck -->
  <g transform="translate(280, 24)">
    <circle cx="10" cy="16" r="5" fill="#e8c872" filter="url(#hudGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="#a8a4c2" font-family="monospace" font-size="11" font-weight="600">OPERATOR NOC DECK</text>
    <text x="24" y="32" fill="#e8c872" font-family="monospace" font-size="15" font-weight="bold">PORT :8484 ⚡ 47+ TOOLS</text>
  </g>

  <!-- Metric 3: Cryptographic Vault -->
  <g transform="translate(530, 24)">
    <circle cx="10" cy="16" r="5" fill="#f472b6" filter="url(#hudGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="#a8a4c2" font-family="monospace" font-size="11" font-weight="600">ARGON2ID BYOK VAULT</text>
    <text x="24" y="32" fill="#f472b6" font-family="monospace" font-size="15" font-weight="bold">PORT :8686 🔐 ZERO-LEAK</text>
  </g>

  <!-- Metric 4: Hardware & Model -->
  <g transform="translate(780, 24)">
    <circle cx="10" cy="16" r="5" fill="#34d399" filter="url(#hudGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="#a8a4c2" font-family="monospace" font-size="11" font-weight="600">ESP32-S3 COMPANION</text>
    <text x="24" y="32" fill="#34d399" font-family="monospace" font-size="15" font-weight="bold">115200 BAUD 📟 SYNC</text>
  </g>
</svg>
