<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="30%" stop-color="#00f0ff" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#00f0ff;#e8c872;#a855f7;#00f0ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#e8c872" stop-opacity="1">
        <animate attributeName="stop-color" values="#e8c872;#00f0ff;#ff0055;#e8c872" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#a855f7;#00f0ff;#e8c872;#a855f7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing background beam -->
  <line x1="50" y1="20" x2="1150" y2="20" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#neonGlow)" />
  <line x1="150" y1="20" x2="1050" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />

  <!-- Center Diamond & Sacred Alchemical Nodes -->
  <g transform="translate(600, 20)">
    <!-- Rotating outer ring -->
    <circle r="12" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </circle>
    <!-- Pulsing gold diamond -->
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#e8c872" filter="url(#neonGlow)">
      <animate attributeName="transform" type="scale" values="1;1.25;1" dur="2.5s" repeatCount="indefinite" transform-origin="center" />
      <animate attributeName="fill" values="#e8c872;#00f0ff;#e8c872" dur="5s" repeatCount="indefinite" />
    </polygon>
    <!-- Inner bright spark -->
    <circle r="2" fill="#ffffff">
      <animate attributeName="r" values="1.5;3;1.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Triad Marks -->
  <g transform="translate(350, 20)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00f0ff" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </polygon>
  </g>
  <g transform="translate(150, 20)">
    <circle r="3" fill="#a855f7" opacity="0.7">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Triad Marks -->
  <g transform="translate(850, 20)">
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#00f0ff" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </polygon>
  </g>
  <g transform="translate(1050, 20)">
    <circle r="3" fill="#a855f7" opacity="0.7">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
