[package]
name = "zoth-vault-daemon"
version = "0.1.0"
edition = "2021"
description = "Local-only secure BYOK vault backend for Zoth Studio"
license = "MIT"
publish = false

[dependencies]
# HTTP (localhost only)
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Crypto — real constructions, not theater
argon2 = "0.5"
chacha20poly1305 = "0.10"
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4"

# Paths / errors / logging
directories = "5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
