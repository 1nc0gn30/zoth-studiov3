# ═══════════════════════════════════════════════════════════════
# ZOTH STUDIO — Production Netlify Architecture Configuration
# Generated by Zoth Sovereign Netlify AX Engine (v2.0)
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "public"
  command = "echo 'Zoth Studio Static Foundry Built'"

# -----------------------------------------------------------------------------
# 1. Edge Normalization & Canonical Domain Redirects
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/hub"
  to = "/"
  status = 301

[[redirects]]
  from = "/hub/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/wall"
  to = "/social/"
  status = 301

[[redirects]]
  from = "/social-wall"
  to = "/social/"
  status = 301

[[redirects]]
  from = "/netlify-ax"
  to = "/studio/netlify-ax.html"
  status = 301

[[redirects]]
  from = "/deploy"
  to = "/studio/netlify-ax.html"
  status = 301

[[redirects]]
  from = "/api/netlify-ax"
  to = "/api/netlify-ax.json"
  status = 200

# -----------------------------------------------------------------------------
# 2. Universal Security Headers (A+ Grade)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# -----------------------------------------------------------------------------
# 3. Canonical AEO & Machine Readable Documents (JSON / TXT / XML)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/agents.md"
  [headers.values]
    Content-Type = "text/markdown; charset=UTF-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/api/netlify-ax.json"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=1800, must-revalidate"

# -----------------------------------------------------------------------------
# 4. Static Asset Caching (Immutable Media & Shaders)
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
